name: Bug report
description: Report a reproducible product or trust-invariant failure
body:
  - type: textarea
    id: observed
    attributes: { label: Observed behaviour }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: Expected behaviour }
    validations: { required: true }
  - type: textarea
    id: reproduction
    attributes: { label: Reproduction }
    validations: { required: true }
  - type: textarea
    id: invariant
    attributes: { label: Affected invariant }
  - type: textarea
    id: evidence
    attributes: { label: Relevant logs or screenshots }
  - type: textarea
    id: regression
    attributes: { label: Required regression test }
    validations: { required: true }
